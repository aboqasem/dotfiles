  ]

[[groups]]
  name = "Oh My Zsh"
[[groups.items]]
  type = "symlink"
  paths = [
    [".oh-my-zsh", { type = "dir" }],
  ]

[[groups]]
  name = "LunarVim"
[[groups.items]]
  type = "symlink"
  paths = [
    [".config/lvim", { type = "dir" }],
  ]

[[groups]]
  name = "Git"
