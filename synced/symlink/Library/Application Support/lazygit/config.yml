# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  sidePanelWidth: 0.3
  commandLogSize: 4
  nerdFontsVersion: "3"

git:
  overrideGpg: true
  diffRenderers:
    - command: delta --paging=never "$([ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = Dark ] && echo --dark || echo --light)"
  autoForwardBranches: allBranches

refresher:
  fetchInterval: 3600 # 1 hour

os:
  editPreset: nvim
